name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'
  WAILS_VERSION: 'v2.15.0'
  APP_ID: dev.alplix.iris

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build windows ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install mingw and nsis
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build Iris compute client (irisd)
        run: |
          mkdir -p build/bin
          GOOS=windows GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o build/bin/irisd.exe ./cmd/irisd

      - name: Build (NSIS installer)
        # Bindings are committed (CI checks they are current); generating them
        # would need the Linux GTK/WebKit headers on this runner. The Tilvar
        # key is baked into the manager only — irisd never links this package.
        env:
          TILVAR_API_KEY: ${{ secrets.TILVAR_API_KEY }}
        run: wails build -platform windows/${{ matrix.arch }} -nsis -webview2 download -skipbindings -ldflags "-X github.com/alplix/iris/internal/tilvar.APIKey=$TILVAR_API_KEY"

      - name: Stage portable zip
        working-directory: build/bin
        run: |
          mv iris.exe iris-windows-${{ matrix.arch }}.exe
          mv irisd.exe irisd-windows-${{ matrix.arch }}.exe
          zip -r ../../iris-windows-${{ matrix.arch }}.zip iris-windows-${{ matrix.arch }}.exe irisd-windows-${{ matrix.arch }}.exe
          # Flat path, so the installer is not nested in a build/bin directory in the release.
          mv iris-${{ matrix.arch }}-installer.exe ../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            iris-windows-${{ matrix.arch }}.zip
            iris-${{ matrix.arch }}-installer.exe

  build-linux:
    name: Build linux ${{ matrix.arch }}
    # The GTK/WebKit build uses cgo, so arm64 is built natively, not cross-compiled.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        # The Tilvar key is baked into the manager only — irisd never links this package.
        env:
          TILVAR_API_KEY: ${{ secrets.TILVAR_API_KEY }}
        run: wails build -platform linux/${{ matrix.arch }} -clean -tags webkit2_41 -ldflags "-X github.com/alplix/iris/internal/tilvar.APIKey=$TILVAR_API_KEY"

      # After the Wails build: `-clean` empties build/bin.
      - name: Build Iris compute client (irisd)
        run: |
          mkdir -p build/bin
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o build/bin/irisd ./cmd/irisd

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Package .deb and .rpm
        env:
          IRIS_PKG_VERSION: ${{ github.ref_name }}
          IRIS_PKG_ARCH: ${{ matrix.arch }}
        run: |
          export IRIS_PKG_VERSION="${IRIS_PKG_VERSION#v}" # nfpm's version must not start with "v"
          # A manual dispatch off a branch (rather than a vX.Y.Z tag) leaves a
          # branch name here, which neither dpkg nor rpm accept as a version
          # (must start with a digit, and rpm treats "-" as its own Version/
          # Release separator) — fall back to a harmless placeholder instead
          # of failing the build.
          if ! [[ "$IRIS_PKG_VERSION" =~ ^[0-9] ]]; then
            IRIS_PKG_VERSION="0.0.0"
          fi
          export IRIS_PKG_VERSION
          nfpm pkg --config build/linux/nfpm.yaml --packager deb --target iris-${{ matrix.arch }}.deb
          nfpm pkg --config build/linux/nfpm.yaml --packager rpm --target iris-${{ matrix.arch }}.rpm

      - name: Verify the .deb installs cleanly (with its declared dependencies)
        run: sudo apt-get install -y ./iris-${{ matrix.arch }}.deb

      - name: Sanity-check the .rpm's metadata
        run: |
          sudo apt-get install -y rpm
          rpm -qip iris-${{ matrix.arch }}.rpm

      - name: Build AppImage
        env:
          # linuxdeploy's own asset names; there's no "amd64"/"arm64" build.
          LINUXDEPLOY_ARCH: ${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}
        run: |
          curl -L -o linuxdeploy.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage"
          curl -L -o linuxdeploy-plugin-gtk.sh "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-gtk.sh
          # GitHub-hosted runners have no FUSE, so run linuxdeploy extracted
          # instead of as an AppImage.
          ./linuxdeploy.AppImage --appimage-extract >/dev/null
          mkdir -p AppDir/usr/bin
          cp build/bin/iris AppDir/usr/bin/iris
          cp build/bin/irisd AppDir/usr/bin/irisd
          # linuxdeploy names the deployed icon after --icon-file's own
          # filename, but iris.desktop declares Icon=iris — a mismatched
          # icon.png vs iris.desktop's Icon=iris fails deployment outright
          # ("Could not find suitable icon for Icon entry: iris").
          cp build/icon.png iris.png
          DEPLOY_GTK_VERSION=3 ./squashfs-root/AppRun \
            --appdir AppDir \
            --executable AppDir/usr/bin/iris \
            --desktop-file build/linux/iris.desktop \
            --icon-file iris.png \
            --plugin gtk \
            --output appimage
          mv Iris-*.AppImage iris-${{ matrix.arch }}.AppImage || mv Alperen*.AppImage iris-${{ matrix.arch }}.AppImage
          chmod +x iris-${{ matrix.arch }}.AppImage

      - name: Verify the AppImage's binary has no missing shared libraries
        # A real run needs a display; this instead checks the same thing a
        # missing-library crash would actually be caused by, without needing
        # Xvfb in the release pipeline: every dynamic dependency of the
        # bundled binary resolves against the AppImage's own bundled libs
        # (or the base system libs every distro has), so "not found" would
        # mean the AppImage is broken on a machine that lacks GTK/WebKit
        # installed system-wide — precisely the case an AppImage exists for.
        run: |
          ./iris-${{ matrix.arch }}.AppImage --appimage-extract >/dev/null
          missing=$(LD_LIBRARY_PATH="squashfs-root/usr/lib:$LD_LIBRARY_PATH" ldd squashfs-root/usr/bin/iris | grep "not found" || true)
          if [ -n "$missing" ]; then
            echo "$missing"
            echo "::error::AppImage is missing shared libraries it needs to run"
            exit 1
          fi

      - name: Stage archive
        working-directory: build/bin
        run: |
          mv iris iris-linux-${{ matrix.arch }}
          mv irisd irisd-linux-${{ matrix.arch }}
          tar -czf ../../iris-linux-${{ matrix.arch }}.tar.gz iris-linux-${{ matrix.arch }} irisd-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            iris-linux-${{ matrix.arch }}.tar.gz
            iris-${{ matrix.arch }}.deb
            iris-${{ matrix.arch }}.rpm
            iris-${{ matrix.arch }}.AppImage

  build-darwin:
    name: Build darwin ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        # The Tilvar key is baked into the manager only — irisd never links this package.
        env:
          TILVAR_API_KEY: ${{ secrets.TILVAR_API_KEY }}
        run: wails build -platform darwin/${{ matrix.arch }} -clean -skipbindings -ldflags "-X github.com/alplix/iris/internal/tilvar.APIKey=$TILVAR_API_KEY"

      # After the Wails build: `-clean` empties build/bin.
      - name: Build Iris compute client (irisd)
        run: |
          mkdir -p build/bin
          GOOS=darwin GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o build/bin/irisd ./cmd/irisd

      - name: Embed irisd into app bundle
        run: |
          APP="$(find build/bin -maxdepth 2 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then echo "No .app bundle produced"; exit 1; fi
          mkdir -p "$APP/Contents/Resources"
          cp build/bin/irisd "$APP/Contents/Resources/irisd"

      - name: Stage archive
        working-directory: build/bin
        run: |
          APP="$(find . -maxdepth 2 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then echo "No .app bundle produced"; exit 1; fi
          ditto -c -k --keepParent "$APP" ../../iris-darwin-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-darwin-${{ matrix.arch }}
          if-no-files-found: error
          path: iris-darwin-${{ matrix.arch }}.zip

  # The compute client is pure Go, so it also ships for 32-bit systems, RISC-V
  # and POWER. The manager (WebView) stays on amd64/arm64.
  build-client-extra:
    name: irisd ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-386,      goos: linux,   goarch: "386" }
          - { name: linux-armv7,    goos: linux,   goarch: arm,     goarm: "7" }
          - { name: linux-armv6,    goos: linux,   goarch: arm,     goarm: "6" }
          - { name: linux-riscv64,  goos: linux,   goarch: riscv64 }
          - { name: linux-ppc64le,  goos: linux,   goarch: ppc64le }
          - { name: linux-ppc64,    goos: linux,   goarch: ppc64 }
          - { name: windows-386,    goos: windows, goarch: "386" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build irisd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          mkdir stage
          EXT=""; [ "$GOOS" = windows ] && EXT=".exe"
          go build -ldflags="-s -w" -trimpath -o "stage/irisd$EXT" ./cmd/irisd
          cp LICENSE stage/

      - name: Package
        run: |
          if [ "${{ matrix.goos }}" = windows ]; then
            (cd stage && zip -q ../irisd-${{ matrix.name }}.zip irisd.exe LICENSE)
          else
            tar -czf irisd-${{ matrix.name }}.tar.gz -C stage irisd LICENSE
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: irisd-${{ matrix.name }}
          if-no-files-found: error
          path: |
            irisd-${{ matrix.name }}.zip
            irisd-${{ matrix.name }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-darwin, build-client-extra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true